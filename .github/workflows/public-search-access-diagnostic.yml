name: Public search scoped access diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check independent permissions without changes
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          token = os.environ.get('SUPABASE_ACCESS_TOKEN')
          target = os.environ.get('SUPABASE_PROJECT_ID')
          match = re.search(r'projectId:\s*"([a-z0-9]+)"', Path('vite.config.ts').read_text())
          if not token or not target or not match or target != match.group(1):
              print('::error::Missing credentials or mismatched existing target. Nothing changed.')
              raise SystemExit(1)
          probes = [
              ('Project metadata', '', None),
              ('Function deployment read', '/functions', None),
              ('Provider credential presence', '/secrets', None),
              ('Read-only quota inspection', '/database/query', {'read_only': True, 'query': "SELECT EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'consume_public_presence_search') AS quota_present"}),
          ]
          for label, path, body in probes:
              request = urllib.request.Request('https://api.supabase.com/v1/projects/' + target + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  print(label + ': access verified')
                  if path == '/secrets':
                      names = {item.get('name') for item in data if isinstance(item, dict)}
                      print('Required search credentials present: ' + str({'FIRECRAWL_API_KEY', 'LOVABLE_API_KEY'}.issubset(names)))
                  if body is not None:
                      print('Quota present: ' + str(bool(data and data[0].get('quota_present'))))
                  del data
              except urllib.error.HTTPError as error:
                  print(label + ': HTTP ' + str(error.code) + ' (response omitted)')
              except Exception:
                  print(label + ': could not verify (details omitted)')
          print('Independent read-only checks complete. No secrets displayed, activation or changes made.')