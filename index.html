    <script>
      // Applies the user's saved Dark/Light choice before first paint, so
      // there's no flash of the wrong theme once React mounts and
      // VibeThemeSync (src/components/VibeThemeSync.tsx) takes over. Reads
      // localStorage only -- it's the one theme source available this
      // early; a signed-in user's profile-stored choice is reconciled by
      // VibeThemeSync after mount, already applied at that point in a
      // previous session so this still matches on the very next load.
      // Only "daylight"/"midnight" are selectable (see VibePicker) -- any
      // other stored value, including the retired "neon", falls back to
      // Midnight, the product's default look.
      (function () {
        try {
          var html = document.documentElement;
          var stored = localStorage.getItem("ui_vibe");
          var vibe = stored === "daylight" ? "daylight" : "midnight";
          html.setAttribute("data-vibe", vibe);
          var isLight = vibe === "daylight";
          html.classList.toggle("dark", !isLight);
          html.style.colorScheme = isLight ? "light" : "dark";
          html.style.backgroundColor = isLight ? "#FAF8F5" : "#05070D";
          var meta = document.getElementById("meta-theme-color");
          if (meta) meta.setAttribute("content", isLight ? "#FAF8F5" : "#05070D");
          localStorage.setItem("ui_vibe", vibe);
        } catch (_) {}
      })();
    </script>
